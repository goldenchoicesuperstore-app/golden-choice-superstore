<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-300">

<!-- Box 1: what is currently there -->
<div class="w-[800px] border border-red-500 mx-auto bg-white mb-4">
  <div class="relative w-full overflow-hidden rounded-xl shadow-sm">
    <img 
      src="https://via.placeholder.com/400x800" 
      class="w-full h-auto max-h-[180px] object-cover object-center block mx-auto"
    />
  </div>
</div>

<!-- Box 2: what if we just remove h-auto and add h-full? -->
<div class="w-[800px] border border-green-500 mx-auto bg-white">
  <div class="relative w-full overflow-hidden rounded-xl shadow-sm">
    <img 
      src="https://via.placeholder.com/400x800" 
      class="w-full h-full max-h-[180px] object-cover object-center block mx-auto"
    />
  </div>
</div>

</body>
</html>
